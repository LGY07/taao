name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: Formatting
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Test (${{ matrix.features }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - tao
          - tao,event,tracing
          - winit
          - winit,event,tracing
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --no-default-features --features "${{ matrix.features }}"
