[package]
name = "taao"
description = "A crate that bridges tao and async rust, and also supports winit."
authors = ["Tuxium <ursusfeline07@gmail.com>", "Enita Nureya <enitanureya@outlook.com>"]
repository = "https://github.com/LGY07/taao"
readme = "README.md"
version = "0.1.3"
edition = "2024"
license = "MIT OR Apache-2.0"
keywords = ["async", "block-on", "event-loop", "tao", "winit"]
categories = ["asynchronous", "gui"]

[features]
default = ["tao"]
tao = ["dep:tao"]
winit = ["dep:winit"]
event = ["dep:async-channel", "dep:futures-lite"]
tracing = ["dep:tracing"]

[[example]]
name = "tao_event_loop"
required-features = ["tao", "event"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }
unsafe_code = "deny"

[dependencies]
async-channel = { version = "2", optional = true }
futures-lite = { version = "2", optional = true }
tao = { version = "0.37", optional = true }
tracing = { version = "0.1", optional = true }
winit = { version = "0.30", optional = true }

[dev-dependencies]
async-executor = "1"
async-fs = "2"
